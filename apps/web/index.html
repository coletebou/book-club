<!doctype html>
<html lang="en">
  <head>
    <!-- Sets data-theme before first paint (D118): light "vellum" or dark "lucerna", the reader's
         choice else the system's. A classic external script (CSP has no 'unsafe-inline'/hash),
         first in <head> so it runs before anything paints. -->
    <script src="/theme-init.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ead2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f160e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Book Club" />
    <meta name="description" content="A private reading room for friends: read and listen together, never spoiled." />
    <!-- Share cards (D213). __PUBLIC_ORIGIN__ is replaced by the server with this instance's own
         address (apps/server/src/routes/static.ts) when it serves this file, so a link shared
         from a self-hosted instance always carries an absolute, reachable image and url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Book Club" />
    <meta property="og:title" content="Book Club — read together, never spoiled" />
    <meta property="og:description" content="A private reading room for friends: read and listen together, never spoiled." />
    <meta property="og:url" content="__PUBLIC_ORIGIN__/" />
    <meta property="og:image" content="__PUBLIC_ORIGIN__/landing/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Book Club — read together, never spoiled" />
    <meta name="twitter:description" content="A private reading room for friends: read and listen together, never spoiled." />
    <meta name="twitter:image" content="__PUBLIC_ORIGIN__/landing/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The one text face, preloaded (D117): EB Garamond Variable, Latin normal. Everything else
         (italic, Latin Extended, the display/hand/mono faces) loads lazily, by unicode-range. -->
    <link rel="preload" href="/fonts/eb-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Book Club</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
