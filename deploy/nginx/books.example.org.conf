# books.example.org (your BOOKCLUB_HOST) in the nginx of a host that serves other sites on ports 80
# and 443 (docs/DEPLOY.md, "Behind the host's own web server"). The app is the container
# deploy/compose.host-proxy.yaml publishes on 127.0.0.1:3110. If a CDN such as Cloudflare proxies the
# name to this host (an A record, SSL "Full (strict)"), the certificate can still be Let's Encrypt's,
# renewed by certbot through the port-80 server below, which the CDN lets ACME challenges reach over
# plain HTTP.
# It needs, in the http block, the usual `map $http_upgrade $connection_upgrade` and, behind a CDN,
# its real-IP header (Cloudflare: `real_ip_header CF-Connecting-IP` for Cloudflare's addresses), so
# that $remote_addr is the reader's (e.g. two small files in /etc/nginx/conf.d/).
#   sudo cp deploy/nginx/books.example.org.conf /etc/nginx/sites-available/books.example.org
#   sudo ln -s /etc/nginx/sites-available/books.example.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name books.example.org;
    # certbot answers its HTTP-01 challenges here while it renews; everything else goes to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    # IPv4 only, like the host's other sites: a [::]:443 listener here would become the default for
    # every name on that address. Behind a CDN, readers on IPv6 reach the CDN, which comes here over
    # IPv4; without one, add `listen [::]:443 ssl;` if the host's other sites do too.
    listen 443 ssl;
    server_name books.example.org;

    ssl_certificate /etc/letsencrypt/live/books.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # As deploy/Caddyfile: the app does not send it itself.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads go straight through to the app, as with Caddy: tus chunks of 8 MiB, a transcript of up
    # to 32 MiB. The app keeps its own limits on sizes and times (MAX_UPLOAD_BYTES, D71).
    client_max_body_size 0;
    proxy_request_buffering off;
    # Media goes out as the reader takes it: a player asks for the rest of a long track and often
    # stops early, and a buffering nginx would first copy all of it to disk.
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The reader's address as nginx found it, in place of anything the client sent, and none of
        # the client's own forwarded headers (an empty value drops one): the app and its tus server
        # read the host and Forwarded too.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        # The app believes those two only with the key (TRUST_PROXY_KEY): other users of this host
        # reach its port from the same address as nginx. The file is root's alone (docs/DEPLOY.md):
        #   proxy_set_header X-Bookclub-Proxy-Key "…";
        include /etc/nginx/book-club/proxy-key.conf;
        # The live connection (/ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Never the tighter limit: the app has its own (D71), and the server's heartbeat crosses
        # the WebSocket every 20 s.
        proxy_read_timeout 10m;
    }
}
