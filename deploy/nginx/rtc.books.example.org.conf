# Voice channels and listening together (D153-D159): LiveKit's signalling connection, on its own
# subdomain so it never collides with the app's own /ws (deploy/nginx/books.example.org.conf) and
# so Cloudflare (or any CDN) can be told, once, "this name is DNS-only" without touching the main
# site's proxying. Optional: skip this file entirely until BOOKCLUB_LIVEKIT_* is set (docs/DEPLOY.md).
#   sudo cp deploy/nginx/rtc.books.example.org.conf /etc/nginx/sites-available/rtc.books.example.org
#   sudo ln -s /etc/nginx/sites-available/rtc.books.example.org /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d rtc.books.example.org   # its own certificate, this name only
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: an A record for rtc.books.example.org at this host's address, DNS-only (grey cloud) if the
# zone is on Cloudflare — real-time media (UDP 7882, TCP 7881) rides beside this connection and
# cannot be proxied by a CDN; only the signalling itself (this file) is a reverse-proxied address.

server {
    listen 80;
    server_name rtc.books.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rtc.books.example.org;

    ssl_certificate /etc/letsencrypt/live/rtc.books.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.books.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # LiveKit's own signalling connection, held open for as long as anyone is in voice.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
